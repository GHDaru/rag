name: Publicar o livro (GitHub Pages)

# Constrói o site a partir do Markdown (motor próprio em publicar/) e publica
# no GitHub Pages a cada push no main. O docs/ é gerado pelo CI, não versionado.

on:
  push:
    branches: [main]
    paths:
      - "livro/**"
      - "publicar/**"
      - "benchmark/**"
      # A trilha e os portões entram nos paths: uma mudança que quebre o
      # rag-zero, o verificador ou o companion tem de disparar o CI. Sem isso,
      # o portão existe e nunca é acionado — que foi o achado da auditoria.
      - "rag-zero/**"
      - "chat-companion/**"
      - "specs/**"
      - "scripts/**"
      - ".github/workflows/publicar.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ------------------------------------------------------------------ #
      # PORTÕES — rodam ANTES do build. Publicar e só então descobrir que o
      # portão falhou é o mesmo que não ter portão.
      #
      # A auditoria comparativa com o livro irmão encontrou que nenhum destes
      # era acionado: o verificador da spec, as duas suítes e o check do
      # companion existiam e o CI fazia apenas build + pdf + deploy.
      # ------------------------------------------------------------------ #
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Portão 1 — critérios de aceite da edição vigente"
        run: python3 specs/001-edicao-1-0/verificar.py

      - name: "Portão 2 — a trilha rag-zero (sem dependência externa)"
        run: python3 -m pytest tests/ -q
        working-directory: rag-zero

      - name: "Portão 3 — o companion (inclui a paridade do BM25 com o rag-zero)"
        run: pip install -q -r requirements.txt && python3 -m pytest tests/ -q
        working-directory: chat-companion/backend

      - name: "Portão 4 — a afirmação sobre o companion não passa do estado real"
        run: bash scripts/check-companion.sh

      - name: Instalar dependências do motor
        run: npm ci
        working-directory: publicar
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Gerar o site (Markdown -> docs/)
        run: npm run build

      - name: "Portão 5 — o template dos capítulos"
        run: node verifica-capitulos.mjs
        working-directory: publicar
        working-directory: publicar
      - name: Instalar Chromium (para os PDFs)
        run: npx playwright install --with-deps chromium
        working-directory: publicar
      - name: Gerar PDFs (livro completo + por capitulo)
        run: npm run pdf
        working-directory: publicar
      - name: Limpar temporario de impressao
        run: rm -f docs/_print.html
      # Pages habilitado manualmente em 2026-08-04 (Settings → Pages → Source:
      # GitHub Actions). Registro do que foi tentado antes, para ninguém repetir:
      # `enablement: true` NÃO resolveu — mesmo com `pages: write`, a API recusou
      # criar o site ("Get Pages site failed ... Not Found", runs #2 e #3).
      # Num repositório novo, portanto, essa habilitação é etapa manual e única.
      # O parâmetro fica como está: é inócuo com o site já criado, e volta a ser
      # a primeira tentativa caso o repositório seja recriado.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
