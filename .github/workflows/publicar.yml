name: Publicar o livro (GitHub Pages)

# Constrói o site a partir do Markdown (motor próprio em publicar/) e publica
# no GitHub Pages a cada push no main. O docs/ é gerado pelo CI, não versionado.

on:
  push:
    branches: [main]
    paths:
      - "livro/**"
      - "publicar/**"
      - "benchmark/**"
      - ".github/workflows/publicar.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências do motor
        run: npm ci
        working-directory: publicar
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Gerar o site (Markdown -> docs/)
        run: npm run build
        working-directory: publicar
      - name: Instalar Chromium (para os PDFs)
        run: npx playwright install --with-deps chromium
        working-directory: publicar
      - name: Gerar PDFs (livro completo + por capitulo)
        run: npm run pdf
        working-directory: publicar
      - name: Limpar temporario de impressao
        run: rm -f docs/_print.html
      # `enablement: true` faz a action tentar HABILITAR o Pages via API, em vez
      # de só consultá-lo. Sem isso, um repositório novo falha aqui com
      # "Get Pages site failed ... Not Found" e o deploy é pulado.
      # Se ainda assim falhar (a API pode recusar dependendo do plano/permissão),
      # a saída é manual e única: Settings → Pages → Source: GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
