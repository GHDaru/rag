name: Publicar o livro (GitHub Pages)

# Constrói o site a partir do Markdown (motor próprio em publicar/) e publica
# no GitHub Pages a cada push no main. O docs/ é gerado pelo CI, não versionado.

on:
  push:
    branches: [main]
    paths:
      - "livro/**"
      - "publicar/**"
      - "benchmark/**"
      # A trilha e os portões entram nos paths: uma mudança que quebre o
      # rag-zero, o verificador ou o companion tem de disparar o CI. Sem isso,
      # o portão existe e nunca é acionado — que foi o achado da auditoria.
      - "rag-zero/**"
      - "chat-companion/**"
      - "specs/**"
      - "scripts/**"
      - ".github/workflows/publicar.yml"
  # Os portões precisam rodar ANTES da decisão de merge, não depois. Como o merge
  # na `main` É a publicação (ADR 0001), sem este gatilho o portão humano decidiria
  # sem sinal de CI — o mesmo argumento que este ciclo usou para mover os portões
  # para antes do build, aplicado um nível acima. Achado da revisão independente.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # O grupo inclui a ref: sem isso, um push em PR cancela a publicação de
  # produção em andamento. Só a fila da `main` cancela a si mesma.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # HISTÓRICO COMPLETO, e não é detalhe: o Portão 1 confere as datas do
          # cabeçalho contra o git. Num clone raso todo arquivo parece introduzido
          # pelo commit enxertado — o portão produz 25 falhas falsas no primeiro
          # commit datado em outro dia, e a checagem de captura sem diff (ADR 0016)
          # nunca chega a executar. O portão deste ciclo não valia onde foi
          # instalado; achado da segunda revisão independente.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ------------------------------------------------------------------ #
      # PORTÕES — rodam ANTES do build. Publicar e só então descobrir que o
      # portão falhou é o mesmo que não ter portão.
      #
      # A auditoria comparativa com o livro irmão encontrou que nenhum destes
      # era acionado: o verificador da spec, as duas suítes e o check do
      # companion existiam e o CI fazia apenas build + pdf + deploy.
      # ------------------------------------------------------------------ #
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Portão 1 — critérios de aceite da edição vigente"
        run: python3 specs/001-edicao-1-0/verificar.py

      - name: "Portão 2 — a trilha rag-zero (sem dependência externa)"
        run: python3 -m pytest tests/ -q
        working-directory: rag-zero

      - name: "Portão 3 — o companion (inclui a paridade do BM25 com o rag-zero)"
        run: pip install -q -r requirements.txt && python3 -m pytest tests/ -q
        working-directory: chat-companion/backend

      - name: "Portão 4 — a afirmação sobre o companion não passa do estado real"
        run: bash scripts/check-companion.sh

      # Restrição 4 da constituição (ADR 0014): cada etapa roda isolada, sem rede e
      # sem ter executado a anterior. A promessa "custo zero, sem dependência" só vale
      # se for testada — e este é o teste.
      - name: "Portão 6 — as etapas do rag-zero rodam isoladas"
        run: python3 ferramentas/verificar_etapas.py
        working-directory: rag-zero

      - name: Instalar dependências do motor
        run: npm ci
        working-directory: publicar
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Gerar o site (Markdown -> docs/)
        run: npm run build

      - name: "Portão 5 — o template dos capítulos"
        run: node verifica-capitulos.mjs
        working-directory: publicar

      - name: Instalar Chromium (para os PDFs)
        run: npx playwright install --with-deps chromium
        working-directory: publicar
      - name: Gerar PDFs (livro completo + por capitulo)
        run: npm run pdf
        working-directory: publicar
      - name: Limpar temporario de impressao
        run: rm -f docs/_print.html
      # Pages habilitado manualmente em 2026-08-04 (Settings → Pages → Source:
      # GitHub Actions). Registro do que foi tentado antes, para ninguém repetir:
      # `enablement: true` NÃO resolveu — mesmo com `pages: write`, a API recusou
      # criar o site ("Get Pages site failed ... Not Found", runs #2 e #3).
      # Num repositório novo, portanto, essa habilitação é etapa manual e única.
      # O parâmetro fica como está: é inócuo com o site já criado, e volta a ser
      # a primeira tentativa caso o repositório seja recriado.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    # Em pull request os portões rodam e o site é construído; **publicar, não**.
    # O merge na `main` é o que publica (ADR 0001), e um PR que publicasse
    # contradiria a decisão que governa este repositório.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
