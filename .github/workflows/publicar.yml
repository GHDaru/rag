name: Publicar o livro (GitHub Pages)

# Constrói o site a partir do Markdown (motor próprio em publicar/) e publica
# no GitHub Pages a cada push no main. O docs/ é gerado pelo CI, não versionado.

on:
  push:
    branches: [main]
    paths:
      - "livro/**"
      - "publicar/**"
      - "benchmark/**"
      - ".github/workflows/publicar.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências do motor
        run: npm ci
        working-directory: publicar
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Gerar o site (Markdown -> docs/)
        run: npm run build
        working-directory: publicar
      - name: Instalar Chromium (para os PDFs)
        run: npx playwright install --with-deps chromium
        working-directory: publicar
      - name: Gerar PDFs (livro completo + por capitulo)
        run: npm run pdf
        working-directory: publicar
      - name: Limpar temporario de impressao
        run: rm -f docs/_print.html
      # Pages habilitado manualmente em 2026-08-04 (Settings → Pages → Source:
      # GitHub Actions). Registro do que foi tentado antes, para ninguém repetir:
      # `enablement: true` NÃO resolveu — mesmo com `pages: write`, a API recusou
      # criar o site ("Get Pages site failed ... Not Found", runs #2 e #3).
      # Num repositório novo, portanto, essa habilitação é etapa manual e única.
      # O parâmetro fica como está: é inócuo com o site já criado, e volta a ser
      # a primeira tentativa caso o repositório seja recriado.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
