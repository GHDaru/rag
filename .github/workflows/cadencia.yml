name: Cadência do livro vivo

# Por que existe um workflow AGENDADO (ADR 0013).
#
# Todo portão deste repositório dispara por commit. Mas a coisa que este livro
# promete vigiar — o apodrecimento do estado da arte — não gera commit nenhum: ela
# acontece **enquanto ninguém mexe**. Um livro cuja tese central é a cláusula de
# expiração precisa de um portão que o tempo consiga quebrar sozinho, e é este.
#
# Ele não publica nada e não corrige nada. Ele abre uma issue quando a janela vence.

on:
  schedule:
    # Dia 1 de cada mês, 09:00 UTC. Mensal, e não diário: a janela é trimestral, e
    # um portão que grita todo dia é um portão que se aprende a ignorar.
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  janela:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # o verificador confere datas contra o git
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Cadência — janela declarada, cumprida, captura e placar"
        id: verificar
        run: |
          set +e
          saida=$(python3 specs/001-edicao-1-0/verificar.py 2>&1)
          codigo=$?
          echo "$saida"
          {
            echo "relatorio<<FIM"
            echo "$saida" | grep -E "ADR 0013" || echo "(sem achados de cadência)"
            echo "FIM"
          } >> "$GITHUB_OUTPUT"
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          exit 0

      - name: "Abrir/atualizar a issue da janela"
        if: steps.verificar.outputs.codigo != '0'
        uses: actions/github-script@v7
        env:
          RELATORIO: ${{ steps.verificar.outputs.relatorio }}
        with:
          script: |
            const titulo = "Cadência do livro vivo — a janela venceu";
            const corpo = [
              "A verificação agendada encontrou pendência de cadência (ADR 0013).",
              "",
              "```",
              process.env.RELATORIO,
              "```",
              "",
              "O que a janela faz está no Guia Editorial, §7. A regra que não pode ser",
              "violada: **recapturar a data só onde houve releitura** — trocar a data sem",
              "reler passa no verificador e falsifica o livro.",
            ].join("\n");
            // `listForRepo` devolve issues E pull requests, 30 por página. Sem
            // paginar e sem filtrar PR, a issue existente some depois de 30 itens
            // abertos e passa a nascer uma duplicata por mês.
            const abertas = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", per_page: 100,
            });
            const existente = abertas.find((i) => !i.pull_request && i.title === titulo);
            if (existente) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existente.number, body: corpo,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titulo, body: corpo,
              });
            }
